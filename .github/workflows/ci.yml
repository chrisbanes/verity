name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERITY_PACKAGED_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
  ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
  ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
  ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ env.ORG_GRADLE_PROJECT_remoteBuildCacheUrl != '' && env.ORG_GRADLE_PROJECT_remoteBuildCacheUsername != '' && env.ORG_GRADLE_PROJECT_remoteBuildCachePassword != '' && 'caches/build-cache-1' || '' }}

      - name: Build
        run: ./gradlew build --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

  smoke-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ env.ORG_GRADLE_PROJECT_remoteBuildCacheUrl != '' && env.ORG_GRADLE_PROJECT_remoteBuildCacheUsername != '' && env.ORG_GRADLE_PROJECT_remoteBuildCachePassword != '' && 'caches/build-cache-1' || '' }}

      - name: Verify Linux packaged inputs
        run: |
          uname -s
          uname -m
          ./gradlew :verity:cli:hostJars :verity:cli:verifyHostJars :verity:smoke-tests:packagedProbeJar --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VERITY_PACKAGED_ANDROID_SERIAL: emulator-5554
          VERITY_PACKAGED_TARGET_RECEIPT: ${{ github.workspace }}/verity/smoke-tests/build/reports/packaged-targets/android.json
        with:
          emulator-port: 5554
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            python3 scripts/ci_target_receipt.py android
            ./gradlew :verity:smoke-tests:packagedAndroidTest -PpackagedVariant=linux-x86_64,universal --rerun-tasks --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
            ./gradlew :verity:smoke-tests:test -Pinclude.tags=android --rerun-tasks --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Retain Android smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-android-test-results
          path: |
            verity/smoke-tests/build/test-results/test/*.xml
            verity/smoke-tests/build/test-results/packagedAndroidTest/*.xml
            verity/smoke-tests/build/reports/packaged/
            verity/smoke-tests/build/reports/smoke-grpc.txt
            verity/cli/build/reports/packaged-grpc.txt
            verity/cli/build/reports/host-packaging.tsv
            verity/smoke-tests/build/reports/packaged-targets/
          if-no-files-found: error

  smoke-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ env.ORG_GRADLE_PROJECT_remoteBuildCacheUrl != '' && env.ORG_GRADLE_PROJECT_remoteBuildCacheUsername != '' && env.ORG_GRADLE_PROJECT_remoteBuildCachePassword != '' && 'caches/build-cache-1' || '' }}

      - name: Verify macOS packaged inputs
        run: |
          uname -s
          uname -m
          ./gradlew :verity:cli:hostJars :verity:cli:verifyHostJars :verity:smoke-tests:packagedProbeJar --no-daemon --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Install AppleSimulatorUtils
        run: |
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils
          applesimutils --version

      - name: Start iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          os: iOS
          erase_before_boot: true
          wait_for_boot: true
          shutdown_after_job: true

      - name: iOS smoke tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          VERITY_PACKAGED_IOS_UDID: ${{ steps.simulator.outputs.udid }}
          VERITY_PACKAGED_TARGET_RECEIPT: ${{ github.workspace }}/verity/smoke-tests/build/reports/packaged-targets/ios.json
        run: |
          python3 scripts/ci_target_receipt.py ios
          ./gradlew :verity:smoke-tests:packagedIosTest -PpackagedVariant=macos-aarch64,universal --rerun-tasks --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
          ./gradlew :verity:smoke-tests:test -Pinclude.tags=ios --rerun-tasks --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Retain iOS smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-ios-test-results
          path: |
            verity/smoke-tests/build/test-results/test/*.xml
            verity/smoke-tests/build/test-results/packagedIosTest/*.xml
            verity/smoke-tests/build/reports/packaged/
            verity/smoke-tests/build/reports/packaged-targets/
            verity/smoke-tests/build/reports/smoke-grpc.txt
            verity/cli/build/reports/packaged-grpc.txt
            verity/cli/build/reports/host-packaging.tsv
          if-no-files-found: error
