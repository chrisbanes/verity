name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERITY_PACKAGED_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
  ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
  ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
  ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ env.ORG_GRADLE_PROJECT_remoteBuildCacheUrl != '' && env.ORG_GRADLE_PROJECT_remoteBuildCacheUsername != '' && env.ORG_GRADLE_PROJECT_remoteBuildCachePassword != '' && 'caches/build-cache-1' || '' }}

      - name: Build
        run: ./gradlew build --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

  smoke-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ env.ORG_GRADLE_PROJECT_remoteBuildCacheUrl != '' && env.ORG_GRADLE_PROJECT_remoteBuildCacheUsername != '' && env.ORG_GRADLE_PROJECT_remoteBuildCachePassword != '' && 'caches/build-cache-1' || '' }}

      - name: Verify Linux packaged inputs
        run: |
          uname -s
          uname -m
          python3 -c 'import platform; assert platform.system() == "Linux" and platform.machine() == "x86_64"'
          ./gradlew :verity:cli:hostJars :verity:cli:verifyHostJars :verity:smoke-tests:packagedProbeJar --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: >-
            python3 -c 'import os, platform, subprocess;
            devices = subprocess.run(["adb", "devices"], check=True, capture_output=True, text=True);
            online = [row.split()[0] for row in devices.stdout.splitlines()[1:] if len(row.split()) >= 2 and row.split()[1] == "device"];
            assert len(online) == 1 and online[0].startswith("emulator-"), "Expected exactly one online job-owned emulator";
            assert platform.system() == "Linux" and platform.machine() == "x86_64", "Expected Linux x86-64";
            os.environ["VERITY_PACKAGED_ANDROID_SERIAL"] = online[0];
            from pathlib import Path;
            import json;
            receipt = Path("verity/smoke-tests/build/reports/packaged-targets/android.json");
            receipt.parent.mkdir(parents=True, exist_ok=True);
            receipt.write_text(json.dumps(dict(target=online[0], kind="android", host=platform.system(), arch=platform.machine(), run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], job=os.environ["GITHUB_JOB"], head=os.environ["GITHUB_SHA"])));
            os.environ["VERITY_PACKAGED_TARGET_RECEIPT"] = str(receipt.resolve());
            subprocess.run(["./gradlew", ":verity:smoke-tests:packagedAndroidTest", "-PpackagedVariant=linux-x86_64,universal", "--rerun-tasks", "--no-scan", "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"], check=True);
            raise SystemExit(subprocess.run(["./gradlew", ":verity:smoke-tests:test", "-Pinclude.tags=android", "--rerun-tasks", "--no-scan", "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"]).returncode)'

      - name: Retain Android smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-android-test-results
          path: |
            verity/smoke-tests/build/test-results/test/*.xml
            verity/smoke-tests/build/test-results/packagedAndroidTest/*.xml
            verity/smoke-tests/build/reports/packaged/
            verity/smoke-tests/build/reports/smoke-grpc.txt
            verity/cli/build/reports/packaged-grpc.txt
            verity/cli/build/reports/host-packaging.tsv
            verity/smoke-tests/build/reports/packaged-targets/
          if-no-files-found: error

  smoke-ios:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ env.ORG_GRADLE_PROJECT_remoteBuildCacheUrl != '' && env.ORG_GRADLE_PROJECT_remoteBuildCacheUsername != '' && env.ORG_GRADLE_PROJECT_remoteBuildCachePassword != '' && 'caches/build-cache-1' || '' }}

      - name: Verify macOS packaged inputs
        id: mac_inputs
        run: |
          uname -s
          uname -m
          python3 -c 'import platform; assert platform.system() == "Darwin" and platform.machine() in ("arm64", "aarch64")'
          ./gradlew :verity:cli:hostJars :verity:cli:verifyHostJars :verity:smoke-tests:packagedProbeJar --no-daemon --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Set up Android SDK on macOS
        id: mac_sdk
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK tools
        id: mac_sdk_tools
        run: sdkmanager --version

      - name: Prepare job-owned Android handoff boundary
        id: android_owner_prepare
        env:
          VERITY_BOOT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/android_ios_handoff.py prepare verity/smoke-tests/build/reports/packaged-targets/android-ownership

      - name: macOS packaged Android smoke tests
        id: mac_android
        timeout-minutes: 45
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
          VERITY_BOOT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: arm64-v8a
          cores: 1
          pre-emulator-launch-script: python3 scripts/android_ios_handoff.py prelaunch verity/smoke-tests/build/reports/packaged-targets/android-ownership && python3 scripts/android_boot_diagnostics.py start verity/smoke-tests/build/reports/packaged-targets/android-bootstrap
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off -feature -HVF -qemu -accel tcg
          disable-animations: true
          script: >-
            python3 -c 'import os, platform, subprocess, json;
            from pathlib import Path;
            subprocess.run(["python3", "scripts/android_boot_diagnostics.py", "stop", "verity/smoke-tests/build/reports/packaged-targets/android-bootstrap"], check=True);
            subprocess.run(["python3", "scripts/android_ios_handoff.py", "active", "verity/smoke-tests/build/reports/packaged-targets/android-ownership", "verity/smoke-tests/build/reports/packaged-targets/android-bootstrap"], check=True);
            assert platform.system() == "Darwin" and platform.machine() in ("arm64", "aarch64");
            devices = subprocess.run(["adb", "devices"], check=True, capture_output=True, text=True);
            online = [row.split()[0] for row in devices.stdout.splitlines()[1:] if len(row.split()) >= 2 and row.split()[1] == "device"];
            assert len(online) == 1 and online[0].startswith("emulator-"), "Expected exactly one job-owned emulator";
            os.environ["VERITY_PACKAGED_ANDROID_SERIAL"] = online[0];
            receipt = Path("verity/smoke-tests/build/reports/packaged-targets/android.json");
            receipt.parent.mkdir(parents=True, exist_ok=True);
            receipt.write_text(json.dumps(dict(target=online[0], kind="android", host=platform.system(), arch=platform.machine(), run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], job=os.environ["GITHUB_JOB"], head=os.environ["GITHUB_SHA"])));
            os.environ["VERITY_PACKAGED_TARGET_RECEIPT"] = str(receipt.resolve());
            result = subprocess.run(["./gradlew", ":verity:smoke-tests:packagedAndroidTest", "--rerun", "-PpackagedVariant=macos-aarch64,universal", "--no-scan", "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"]).returncode;
            diagnostic = subprocess.run(["python3", "scripts/android_boot_diagnostics.py", "startup", "verity/smoke-tests/build/reports/packaged-targets/android-bootstrap", str(result)]) if result else None;
            raise SystemExit(result)'

      - name: Stop and join Android bootstrap observer
        id: android_observer_stop
        if: always()
        env:
          VERITY_BOOT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/android_boot_diagnostics.py stop verity/smoke-tests/build/reports/packaged-targets/android-bootstrap

      - name: Verify Android exit before iOS
        id: android_ios_guard
        if: always() && !cancelled()
        env:
          VERITY_BOOT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERITY_HANDOFF_CANCELLED: "false"
          VERITY_HANDOFF_OUTCOMES: >-
            {"inputs":"${{ steps.mac_inputs.outcome }}","sdk":"${{ steps.mac_sdk.outcome }}","tools":"${{ steps.mac_sdk_tools.outcome }}","prepare":"${{ steps.android_owner_prepare.outcome }}","observer":"${{ steps.android_observer_stop.outcome }}","android":"${{ steps.mac_android.outcome }}"}
        run: |
          python3 scripts/android_ios_handoff.py guard verity/smoke-tests/build/reports/packaged-targets/android-ownership verity/smoke-tests/build/reports/packaged-targets/android-bootstrap
          echo "ios_ready=true" >> "$GITHUB_OUTPUT"

      - name: Create job-owned iOS simulator
        id: ios_setup
        if: always() && !cancelled() && steps.android_ios_guard.outputs.ios_ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os, platform, socket, subprocess
          from pathlib import Path
          assert platform.system() == "Darwin" and platform.machine() in ("arm64", "aarch64")
          def simctl(*args):
              return subprocess.run(["xcrun", "simctl", *args], check=True, capture_output=True, text=True, timeout=360).stdout
          devices = json.loads(simctl("list", "devices", "booted", "-j"))["devices"]
          assert not any(devices.values()), "Refuse to reuse an already booted simulator"
          with socket.socket() as port:
              port.bind(("127.0.0.1", 22087))
          runtimes = [r for r in json.loads(simctl("list", "runtimes", "-j"))["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")]
          assert runtimes, "Expected configured iOS 27 runtime"
          runtime = sorted(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))[-1]["identifier"]
          types = [d for d in json.loads(simctl("list", "devicetypes", "-j"))["devicetypes"] if d["name"] == "iPhone 17"]
          assert len(types) == 1, "Expected configured iPhone 17 type"
          name = "Verity-packaged-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          udid = simctl("create", name, types[0]["identifier"], runtime).strip()
          receipt = Path("verity/smoke-tests/build/reports/packaged-targets/ios.json")
          binding = dict(target=udid, kind="ios", name=name, runtime=runtime, model="iPhone 17", host=platform.system(), arch=platform.machine(), run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], job=os.environ["GITHUB_JOB"], head=os.environ["GITHUB_SHA"])
          try:
              receipt.parent.mkdir(parents=True, exist_ok=True)
              receipt.write_text(json.dumps(binding))
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("VERITY_PACKAGED_IOS_UDID=" + udid + "\nVERITY_PACKAGED_TARGET_RECEIPT=" + str(receipt.resolve()) + "\n")
              simctl("boot", udid)
              simctl("bootstatus", udid, "-b")
          except BaseException as setup_failure:
              cleanup_failures = []
              try:
                  devices = json.loads(subprocess.run(["xcrun", "simctl", "list", "devices", "-j"], check=True, capture_output=True, text=True, timeout=60).stdout)["devices"]
                  owned = [d for group in devices.values() for d in group if d["udid"] == udid]
                  if owned and owned[0]["state"] == "Booted":
                      subprocess.run(["xcrun", "simctl", "shutdown", udid], check=True, capture_output=True, text=True, timeout=60)
              except BaseException as failure:
                  cleanup_failures.append(repr(failure))
              try:
                  subprocess.run(["xcrun", "simctl", "delete", udid], check=True, capture_output=True, text=True, timeout=60)
              except BaseException as failure:
                  cleanup_failures.append(repr(failure))
              if not cleanup_failures and receipt.exists():
                  try:
                      binding["cleanup"] = "shutdown-and-delete-completed"
                      receipt.write_text(json.dumps(binding))
                  except BaseException as failure:
                      cleanup_failures.append(repr(failure))
              if cleanup_failures:
                  raise RuntimeError("Owned simulator setup failed; rollback failures: " + "; ".join(cleanup_failures)) from setup_failure
              raise
          PY

      - name: iOS smoke tests
        if: always() && !cancelled() && steps.android_ios_guard.outputs.ios_ready == 'true' && steps.ios_setup.outcome == 'success'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          VERITY_SMOKE_IOS_MODEL: iPhone 17
          VERITY_SMOKE_IOS_RUNTIME: "27"
        run: |
          ./gradlew :verity:smoke-tests:packagedIosTest -PpackagedVariant=macos-aarch64,universal --rerun-tasks --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
          ./gradlew :verity:smoke-tests:test -Pinclude.tags=ios --rerun-tasks --no-scan '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Clean up job-owned iOS simulator
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          udid = os.environ.get("VERITY_PACKAGED_IOS_UDID")
          if udid:
              path = Path(os.environ.get("VERITY_PACKAGED_TARGET_RECEIPT", "verity/smoke-tests/build/reports/packaged-targets/ios.json"))
              receipt = json.loads(path.read_text())
              assert receipt["target"] == udid and all(receipt[key] == os.environ[env] for key, env in (("run", "GITHUB_RUN_ID"), ("attempt", "GITHUB_RUN_ATTEMPT"), ("job", "GITHUB_JOB"), ("head", "GITHUB_SHA")))
              def simctl(*args):
                  return subprocess.run(["xcrun", "simctl", *args], check=True, capture_output=True, text=True, timeout=60).stdout
              devices = json.loads(simctl("list", "devices", "-j"))["devices"]
              device = [d for group in devices.values() for d in group if d["udid"] == udid]
              if receipt.get("cleanup") == "shutdown-and-delete-completed":
                  assert not device, "Rolled-back owned target still exists"
              else:
                  assert len(device) == 1, "Owned target disappeared before cleanup"
                  try:
                      if device[0]["state"] == "Booted":
                          simctl("shutdown", udid)
                  finally:
                      simctl("delete", udid)
                  receipt["cleanup"] = "shutdown-and-delete-completed"
                  path.write_text(json.dumps(receipt))
          PY

      - name: Retain iOS smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-ios-test-results
          path: |
            verity/smoke-tests/build/test-results/test/*.xml
            verity/smoke-tests/build/test-results/packagedAndroidTest/*.xml
            verity/smoke-tests/build/test-results/packagedIosTest/*.xml
            verity/smoke-tests/build/reports/packaged/
            verity/smoke-tests/build/reports/packaged-targets/
            verity/smoke-tests/build/reports/smoke-grpc.txt
            verity/cli/build/reports/packaged-grpc.txt
            verity/cli/build/reports/host-packaging.tsv
          if-no-files-found: error
