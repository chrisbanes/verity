name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ORG_GRADLE_PROJECT_remoteBuildCacheUrl: ${{ secrets.GRADLE_REMOTE_CACHE_URL }}
  ORG_GRADLE_PROJECT_remoteBuildCacheUsername: ${{ secrets.GRADLE_REMOTE_CACHE_USERNAME }}
  ORG_GRADLE_PROJECT_remoteBuildCachePassword: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
  ORG_GRADLE_PROJECT_remoteBuildCachePush: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: ${{ secrets.GRADLE_REMOTE_CACHE_URL != '' && secrets.GRADLE_REMOTE_CACHE_USERNAME != '' && secrets.GRADLE_REMOTE_CACHE_PASSWORD != '' && 'caches/build-cache-1' || '' }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package verified release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :verity:cli:packageRelease --no-scan -Pversion="$VERSION" '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

      - name: Publish or verify matching release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_artifacts.py publish \
            --manifest verity/cli/build/release/manifest.json \
            --assets verity/cli/build/release/assets \
            --receipt verity/cli/build/release/published.json

      - name: Render formula from verified publication receipt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_artifacts.py formula \
            --manifest verity/cli/build/release/manifest.json \
            --receipt verity/cli/build/release/published.json \
            --template Formula/verity.rb \
            --output verity/cli/build/release/verity.rb
          ruby -c verity/cli/build/release/verity.rb

      - name: Update Homebrew formula
        uses: actions/checkout@v7
        with:
          repository: chrisbanes/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write verified formula
        run: |
          mkdir -p homebrew-tap/Formula
          cp verity/cli/build/release/verity.rb homebrew-tap/Formula/verity.rb

      - name: Push formula to tap
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/verity.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "verity ${{ steps.version.outputs.version }}"
          git push
